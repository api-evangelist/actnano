aid: actnano
name: actnano
description: 'actnano, Inc. is a Massachusetts-based advanced materials company that
  develops and manufactures PFAS-free protective nanocoatings for electronics. Its
  flagship Advanced nanoGUARD technology is a gel-state, 100% fluorine-free conformal
  coating applied to printed circuit board assemblies, connectors, antennas, LEDs and
  high-heat-generating components, delivering up to IPx8 moisture and condensation
  protection without trapping heat or degrading signal integrity. Founded in 2012 and
  headquartered in Cambridge, Massachusetts, with a Munich center of excellence and
  operations in Mexico and Japan, actnano serves mobility and automotive electronics,
  consumer electronics, AI and data-center infrastructure, solar, industrial electronics,
  medical devices and optical anti-fog applications. The company states REACH and RoHS
  compliance and ISO 9001:2015 certification, and is backed by BMW i Ventures, Porsche
  Ventures and Emerald Technology Ventures. actnano is a materials manufacturer: it
  publishes no public developer program, API, or machine-readable API contract.'
